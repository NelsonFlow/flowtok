<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowTok — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pink:#fe2c55;--cyan:#00f2ea;--dark:#0a0a0f;--card:#0f0f18;--border:rgba(255,255,255,.08);--muted:rgba(255,255,255,.4);--text:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(254,44,85,.12),transparent);pointer-events:none}

/* LOGO */
.back-nav{position:fixed;top:24px;left:24px;display:flex;align-items:center;gap:20px}
.logo{font-size:18px;font-weight:800;letter-spacing:-0.5px;text-decoration:none;color:var(--text)}
.logo span{color:var(--pink)}
.back-link{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s}
.back-link:hover{color:var(--text)}

/* LANG */
.lang-wrap{position:fixed;top:24px;right:24px;display:flex;gap:4px;background:rgba(255,255,255,.05);border:0.5px solid var(--border);border-radius:8px;padding:3px}
.lang-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:'Inter',sans-serif}
.lang-btn.active{background:var(--pink);color:#fff}

/* CARD */
.auth-card{background:var(--card);border:0.5px solid var(--border);border-radius:18px;padding:36px;width:100%;max-width:420px;position:relative;z-index:1}

/* TABS */
.tabs{display:flex;background:rgba(255,255,255,.04);border:0.5px solid var(--border);border-radius:10px;padding:4px;margin-bottom:28px}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border-radius:7px;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:'Inter',sans-serif}
.tab.active{background:var(--pink);color:#fff}

/* TYPE SELECTOR */
.type-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.type-btn{padding:14px 10px;border-radius:10px;border:0.5px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;text-align:center;transition:all .2s;font-family:'Inter',sans-serif}
.type-btn.active{border-color:var(--pink);background:rgba(254,44,85,.08)}
.type-icon{font-size:22px;margin-bottom:6px}
.type-label{font-size:12px;font-weight:600;color:var(--text)}
.type-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.form-input{width:100%;padding:13px 15px;background:rgba(255,255,255,.05);border:0.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all .2s}
.form-input:focus{border-color:var(--pink);background:rgba(254,44,85,.05)}
.form-input::placeholder{color:rgba(255,255,255,.2)}
.form-input.error{border-color:#fe2c55}
.error-msg{font-size:11px;color:#fe2c55;margin-top:5px;display:none}

/* FORGOT */
.forgot{text-align:right;margin-bottom:20px}
.forgot a{font-size:12px;color:var(--pink);cursor:pointer;text-decoration:none}

/* BTN */
.btn-submit{width:100%;padding:14px;background:var(--pink);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;margin-top:4px}
.btn-submit:hover{opacity:.9}
.btn-submit:active{transform:scale(.98)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:12px;margin:18px 0}
.divider-line{flex:1;height:0.5px;background:var(--border)}
.divider-txt{font-size:11px;color:var(--muted);font-weight:500}

/* SWITCH */
.switch-text{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
.switch-text a{color:var(--pink);font-weight:600;cursor:pointer;text-decoration:none}

/* ALERT */
.alert{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.alert-error{background:rgba(254,44,85,.1);border:0.5px solid rgba(254,44,85,.3);color:#fe8080}
.alert-success{background:rgba(0,200,150,.1);border:0.5px solid rgba(0,200,150,.3);color:#00c896}

/* LOADING */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* PANELS */
.panel{display:none}
.panel.active{display:block}
</style>
</head>
<body>

<div class="back-nav">
  <a href="index.html" class="logo">Flow<span>Tok</span></a>
  <a href="index.html" class="back-link" id="back-link">← Retour</a>
</div>

<div class="lang-wrap">
  <button class="lang-btn" onclick="setLang('vi',this)">VI</button>
  <button class="lang-btn active" onclick="setLang('fr',this)">FR</button>
  <button class="lang-btn" onclick="setLang('en',this)">EN</button>
</div>

<div class="auth-card">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Connexion</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">Créer un compte</button>
  </div>

  <!-- ALERT -->
  <div class="alert alert-error" id="alert-error"></div>
  <div class="alert alert-success" id="alert-success"></div>

  <!-- LOGIN PANEL -->
  <div class="panel active" id="panel-login">
    <div class="form-group">
      <label class="form-label" id="lbl-email-login">Email</label>
      <input class="form-input" id="input-email-login" type="email" placeholder="toi@email.com">
    </div>
    <div class="form-group">
      <label class="form-label" id="lbl-pw-login">Mot de passe</label>
      <input class="form-input" id="input-pw-login" type="password" placeholder="••••••••">
    </div>
    <div class="forgot"><a id="lbl-forgot" onclick="showForgot()">Mot de passe oublié ?</a></div>
    <button class="btn-submit" id="btn-login" onclick="doLogin()">Se connecter</button>
    <div class="switch-text" id="sw-login-text">Pas encore de compte ? <a onclick="switchTab('register')" id="sw-to-reg">Créer un compte</a></div>
  </div>

  <!-- REGISTER PANEL -->
  <div class="panel" id="panel-register">
    <div class="type-sel" id="type-selector">
      <div class="type-btn active" id="type-creator" onclick="selectType('creator')">
        <div class="type-icon">🎬</div>
        <div class="type-label" id="type-creator-label">Créatrice</div>
        <div class="type-sub" id="type-creator-sub">Je crée du contenu</div>
      </div>
      <div class="type-btn" id="type-seller" onclick="selectType('seller')">
        <div class="type-icon">🛍️</div>
        <div class="type-label" id="type-seller-label">Vendeur</div>
        <div class="type-sub" id="type-seller-sub">Je vends des produits</div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" id="lbl-name">Prénom</label>
      <input class="form-input" id="input-name" type="text" placeholder="Hanni">
    </div>
    <div class="form-group">
      <label class="form-label" id="lbl-tiktok">TikTok @</label>
      <input class="form-input" id="input-tiktok" type="text" placeholder="@banimet6">
    </div>
    <div class="form-group">
      <label class="form-label" id="lbl-email-reg">Email</label>
      <input class="form-input" id="input-email-reg" type="email" placeholder="toi@email.com">
    </div>
    <div class="form-group">
      <label class="form-label" id="lbl-pw-reg">Mot de passe</label>
      <input class="form-input" id="input-pw-reg" type="password" placeholder="••••••••">
    </div>
    <button class="btn-submit" id="btn-register" onclick="doRegister()">Créer mon compte</button>
    <div class="switch-text" id="sw-reg-text">Déjà un compte ? <a onclick="switchTab('login')" id="sw-to-login">Se connecter</a></div>
  </div>

  <!-- FORGOT PANEL -->
  <div class="panel" id="panel-forgot">
    <div style="font-size:15px;font-weight:600;margin-bottom:8px" id="forgot-title">Mot de passe oublié</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px" id="forgot-sub">Entre ton email et on t'envoie un lien de réinitialisation.</div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="input-forgot-email" type="email" placeholder="toi@email.com">
    </div>
    <button class="btn-submit" id="btn-forgot" onclick="doForgot()">Envoyer le lien</button>
    <div class="switch-text" style="margin-top:14px"><a onclick="switchTab('login')" id="back-to-login">← Retour à la connexion</a></div>
  </div>

</div>

<script>
const SUPA_URL = 'https://ksrgzdzggpurnffzvray.supabase.co';
const SUPA_KEY = 'sb_publishable_NXrWETcrLI3cUJEO2wJEGA_DXmtWW7R';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let userType = 'creator';

// Check session
sb.auth.getSession().then(({data:{session}})=>{
  if(session) window.location.href = 'dashboard.html';
});

function selectType(t){
  userType = t;
  document.getElementById('type-creator').classList.toggle('active', t==='creator');
  document.getElementById('type-seller').classList.toggle('active', t==='seller');
}

function switchTab(tab){
  ['login','register','forgot'].forEach(p=>{
    document.getElementById('panel-'+p).classList.toggle('active', p===tab);
  });
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  hideAlerts();
}

function showForgot(){
  ['login','register','forgot'].forEach(p=>{
    document.getElementById('panel-'+p).classList.toggle('active', p==='forgot');
  });
  document.getElementById('tab-login').classList.remove('active');
  document.getElementById('tab-register').classList.remove('active');
  hideAlerts();
}

function hideAlerts(){
  document.getElementById('alert-error').style.display='none';
  document.getElementById('alert-success').style.display='none';
}

function showError(msg){
  const el = document.getElementById('alert-error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('alert-success').style.display='none';
}

function showSuccess(msg){
  const el = document.getElementById('alert-success');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('alert-error').style.display='none';
}

function setLoading(btnId, loading){
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  if(loading){
    btn.innerHTML = '<span class="spinner"></span>' + (T[lang].loading||'...');
  } else {
    const labels = {
      'btn-login': T[lang].btnLogin,
      'btn-register': T[lang].btnRegister,
      'btn-forgot': T[lang].btnForgot
    };
    btn.textContent = labels[btnId]||'';
  }
}

async function doLogin(){
  const email = document.getElementById('input-email-login').value.trim();
  const pw = document.getElementById('input-pw-login').value;
  if(!email||!pw){ showError(T[lang].errFields); return; }
  setLoading('btn-login', true);
  hideAlerts();
  const {error} = await sb.auth.signInWithPassword({email, password:pw});
  setLoading('btn-login', false);
  if(error){ showError(T[lang].errLogin||error.message); return; }
  window.location.href = 'dashboard.html';
}

async function doRegister(){
  const name = document.getElementById('input-name').value.trim();
  const tiktok = document.getElementById('input-tiktok').value.trim();
  const email = document.getElementById('input-email-reg').value.trim();
  const pw = document.getElementById('input-pw-reg').value;
  if(!name||!email||!pw){ showError(T[lang].errFields); return; }
  if(pw.length < 6){ showError(T[lang].errPwLen); return; }
  setLoading('btn-register', true);
  hideAlerts();
  const {data, error} = await sb.auth.signUp({
    email, password:pw,
    options:{ data:{ name, tiktok, type:userType } }
  });
  setLoading('btn-register', false);
  if(error){ showError(error.message); return; }
  if(data.user && !data.session){
    showSuccess(T[lang].successConfirm);
  } else {
    window.location.href = 'dashboard.html';
  }
}

async function doForgot(){
  const email = document.getElementById('input-forgot-email').value.trim();
  if(!email){ showError(T[lang].errFields); return; }
  setLoading('btn-forgot', true);
  hideAlerts();
  const {error} = await sb.auth.resetPasswordForEmail(email);
  setLoading('btn-forgot', false);
  if(error){ showError(error.message); return; }
  showSuccess(T[lang].successReset);
}

// LANG
let lang = 'fr';
const T = {
  fr:{
    tabLogin:'Connexion', tabReg:'Créer un compte',
    lblEmailLogin:'Email', lblPwLogin:'Mot de passe', lblForgot:'Mot de passe oublié ?',
    btnLogin:'Se connecter', btnRegister:'Créer mon compte', btnForgot:'Envoyer le lien',
    lblName:'Prénom', lblTiktok:'TikTok @', lblEmailReg:'Email', lblPwReg:'Mot de passe',
    typeCreator:'Créatrice', typeCreatorSub:'Je crée du contenu',
    typeSeller:'Vendeur', typeSellerSub:'Je vends des produits',
    forgotTitle:'Mot de passe oublié', forgotSub:'Entre ton email et on t\'envoie un lien de réinitialisation.',
    swToReg:'Créer un compte', swToLogin:'Se connecter',
    backToLogin:'← Retour à la connexion', backLink:'← Retour',
    swLoginText:'Pas encore de compte ?', swRegText:'Déjà un compte ?',
    errFields:'Remplis tous les champs obligatoires.',
    errLogin:'Email ou mot de passe incorrect.',
    errPwLen:'Le mot de passe doit faire au moins 6 caractères.',
    successConfirm:'Compte créé ! Vérifie ton email pour confirmer.',
    successReset:'Lien envoyé ! Vérifie ton email.',
    loading:'Chargement...'
  },
  vi:{
    tabLogin:'Đăng nhập', tabReg:'Tạo tài khoản',
    lblEmailLogin:'Email', lblPwLogin:'Mật khẩu', lblForgot:'Quên mật khẩu?',
    btnLogin:'Đăng nhập', btnRegister:'Tạo tài khoản', btnForgot:'Gửi liên kết',
    lblName:'Tên', lblTiktok:'TikTok @', lblEmailReg:'Email', lblPwReg:'Mật khẩu',
    typeCreator:'Nhà sáng tạo', typeCreatorSub:'Tôi tạo nội dung',
    typeSeller:'Người bán', typeSellerSub:'Tôi bán sản phẩm',
    forgotTitle:'Quên mật khẩu', forgotSub:'Nhập email và chúng tôi sẽ gửi liên kết đặt lại.',
    swToReg:'Tạo tài khoản', swToLogin:'Đăng nhập',
    backToLogin:'← Quay lại đăng nhập', backLink:'← Quay lại',
    swLoginText:'Chưa có tài khoản?', swRegText:'Đã có tài khoản?',
    errFields:'Vui lòng điền đầy đủ thông tin.',
    errLogin:'Email hoặc mật khẩu không đúng.',
    errPwLen:'Mật khẩu phải có ít nhất 6 ký tự.',
    successConfirm:'Tài khoản đã tạo! Kiểm tra email để xác nhận.',
    successReset:'Đã gửi liên kết! Kiểm tra email của bạn.',
    loading:'Đang tải...'
  },
  en:{
    tabLogin:'Sign in', tabReg:'Create account',
    lblEmailLogin:'Email', lblPwLogin:'Password', lblForgot:'Forgot password?',
    btnLogin:'Sign in', btnRegister:'Create account', btnForgot:'Send link',
    lblName:'First name', lblTiktok:'TikTok @', lblEmailReg:'Email', lblPwReg:'Password',
    typeCreator:'Creator', typeCreatorSub:'I create content',
    typeSeller:'Seller', typeSellerSub:'I sell products',
    forgotTitle:'Forgot password', forgotSub:'Enter your email and we\'ll send a reset link.',
    swToReg:'Create account', swToLogin:'Sign in',
    backToLogin:'← Back to sign in', backLink:'← Back',
    swLoginText:'No account yet?', swRegText:'Already have an account?',
    errFields:'Please fill in all required fields.',
    errLogin:'Invalid email or password.',
    errPwLen:'Password must be at least 6 characters.',
    successConfirm:'Account created! Check your email to confirm.',
    successReset:'Link sent! Check your email.',
    loading:'Loading...'
  }
};

function applyLang(l){
  lang = l;
  const t = T[l];
  document.getElementById('tab-login').textContent = t.tabLogin;
  document.getElementById('tab-register').textContent = t.tabReg;
  document.getElementById('lbl-email-login').textContent = t.lblEmailLogin;
  document.getElementById('lbl-pw-login').textContent = t.lblPwLogin;
  document.getElementById('lbl-forgot').textContent = t.lblForgot;
  document.getElementById('btn-login').textContent = t.btnLogin;
  document.getElementById('btn-register').textContent = t.btnRegister;
  document.getElementById('btn-forgot').textContent = t.btnForgot;
  document.getElementById('lbl-name').textContent = t.lblName;
  document.getElementById('lbl-tiktok').textContent = t.lblTiktok;
  document.getElementById('lbl-email-reg').textContent = t.lblEmailReg;
  document.getElementById('lbl-pw-reg').textContent = t.lblPwReg;
  document.getElementById('type-creator-label').textContent = t.typeCreator;
  document.getElementById('type-creator-sub').textContent = t.typeCreatorSub;
  document.getElementById('type-seller-label').textContent = t.typeSeller;
  document.getElementById('type-seller-sub').textContent = t.typeSellerSub;
  document.getElementById('forgot-title').textContent = t.forgotTitle;
  document.getElementById('forgot-sub').textContent = t.forgotSub;
  document.getElementById('sw-to-reg').textContent = t.swToReg;
  document.getElementById('sw-to-login').textContent = t.swToLogin;
  document.getElementById('back-to-login').textContent = t.backToLogin;
  document.getElementById('back-link').textContent = t.backLink;
  document.getElementById('sw-login-text').childNodes[0].textContent = t.swLoginText + ' ';
  document.getElementById('sw-reg-text').childNodes[0].textContent = t.swRegText + ' ';
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active',(l==='vi'&&b.textContent==='VI')||(l==='fr'&&b.textContent==='FR')||(l==='en'&&b.textContent==='EN'));
  });
}

function setLang(l,el){ applyLang(l); }

function detectLang(){
  const l=navigator.language||'fr';
  if(l.startsWith('vi'))return'vi';
  if(l.startsWith('en'))return'en';
  return'fr';
}

applyLang(detectLang());
</script>
</body>
</html>
